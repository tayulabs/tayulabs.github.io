<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>TAYULABS Cloud</title>
<style>
:root{--bg:#fff;--text:#667085;--brand:#55c62b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:var(--bg)}
.boot{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 8% 5%,rgba(91,193,47,.12),rgba(91,193,47,.035) 24%,transparent 42%),#fff}
.inner{display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px;text-align:center}
.logo{width:130px;max-height:68px;object-fit:contain}
.spinner{width:27px;height:27px;border:3px solid rgba(91,193,47,.18);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite}
.text{color:var(--text);font-size:12px;font-weight:800;line-height:1.45}.error{color:#b42318}
.btn{display:none;border:0;border-radius:12px;padding:12px 16px;background:var(--brand);color:#fff;font:inherit;font-weight:850;cursor:pointer}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="boot">
  <div class="inner">
    <img class="logo" src="imagenes/LOGO-COLOR.jpg" alt="TAYULABS">
    <div id="spinner" class="spinner" aria-hidden="true"></div>
    <div id="status" class="text" role="status" aria-live="polite">Verificando acceso seguro…</div>
    <button id="retryButton" class="btn" type="button">Iniciar sesión</button>
  </div>
</div>
<script type="module">
import Keycloak from 'https://cdn.jsdelivr.net/npm/keycloak-js@26.2.4/lib/keycloak.js';

const keycloak=new Keycloak({
  url:'https://auth.tayulabs.com',
  realm:'tayu-platform',
  clientId:'tayu-dashboard'
});
window.__tayuKeycloak=keycloak;

const status=document.getElementById('status');
const spinner=document.getElementById('spinner');
const retryButton=document.getElementById('retryButton');

async function openLogin(){
  status.classList.remove('error');
  status.textContent='Abriendo inicio de sesión seguro…';
  spinner.style.display='block';
  retryButton.style.display='none';

  return keycloak.login({
    redirectUri:'https://tayulabs.com/cloud-iot.html?v=20260818-loginflow1',
    prompt:'login'
  });
}

retryButton.addEventListener('click',()=>{
  openLogin().catch(showError);
});

function showError(error){
  console.error('TAYULABS login:',error);
  spinner.style.display='none';
  status.textContent='No se pudo abrir el inicio de sesión seguro. Intenta nuevamente.';
  status.classList.add('error');
  retryButton.style.display='inline-block';
}

keycloak.init({
  onLoad:'check-sso',
  pkceMethod:'S256',
  checkLoginIframe:false
}).then(async authenticated=>{
  if(!authenticated){
    await openLogin();
    return;
  }

  const roles=keycloak.tokenParsed?.realm_access?.roles||[];
  const isSuperAdmin=roles.includes('platform_super_admin');
  status.textContent=isSuperAdmin?'Abriendo administración TAYULABS…':'Abriendo plataforma…';

  const target=isSuperAdmin?'cloud-admin-v2.html?v=20260818-loginflow1':'cloud-client.html?v=20260818-loginflow1';
  window.location.replace(new URL(target,window.location.href).href);
}).catch(showError);
</script>
</body>
</html>
