name: Fix cloud client auth routing

on:
  push:
    paths:
      - '.github/workflows/fix-cloud-client-auth-routing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch cloud-client auth routing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('cloud-client.html')
          s = p.read_text(encoding='utf-8')

          old_logout = "return keycloak.logout({ redirectUri: window.location.href });"
          new_logout = "return keycloak.logout({ redirectUri: 'https://tayulabs.com/cloud-iot.html?from=logout' });"

          if old_logout not in s:
              raise SystemExit('Logout pattern not found; aborting safely')
          s = s.replace(old_logout, new_logout, 1)

          old_guard = """  }).then(async authenticated => {
    if (!authenticated) return;

    const appRoot=document.getElementById('app');"""

          new_guard = """  }).then(async authenticated => {
    if (!authenticated) return;

    // Defensa adicional: cloud-client nunca debe abrirse para un Super Admin.
    const realmRoles = keycloak.tokenParsed?.realm_access?.roles || [];
    if (realmRoles.includes('platform_super_admin')) {
      window.location.replace('https://tayulabs.com/cloud-admin-v2.html?v=20260817-fase6-authfix');
      return;
    }

    const appRoot=document.getElementById('app');"""

          if old_guard not in s:
              raise SystemExit('Keycloak init pattern not found; aborting safely')
          s = s.replace(old_guard, new_guard, 1)

          p.write_text(s, encoding='utf-8')
          print('cloud-client auth routing patched OK')
          PY

      - name: Verify patch
        run: |
          grep -F "redirectUri: 'https://tayulabs.com/cloud-iot.html?from=logout'" cloud-client.html
          grep -F "realmRoles.includes('platform_super_admin')" cloud-client.html

      - name: Commit patch
        run: |
          git config user.name 'tayulabs-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add cloud-client.html
          git commit -m 'Fix client logout and Super Admin route guard'
          git push
