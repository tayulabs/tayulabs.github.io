<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<title>TAYULABS Cloud</title>
<style>
:root{--bg:#fff;--text:#667085;--brand:#55c62b;color-scheme:light only}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:#fff!important;color-scheme:light only}
.boot{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 8% 5%,rgba(91,193,47,.12),rgba(91,193,47,.035) 24%,transparent 42%),#fff!important}
.inner{display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px;text-align:center}
.logo{width:130px;max-height:68px;object-fit:contain}.spinner{width:27px;height:27px;border:3px solid rgba(91,193,47,.18);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite}.text{color:var(--text);font-size:12px;font-weight:800;line-height:1.45}.error{color:#b42318}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="boot"><div class="inner"><img class="logo" src="imagenes/LOGO-COLOR.jpg" alt="TAYULABS"><div id="spinner" class="spinner"></div><div id="status" class="text">Verificando acceso seguro…</div></div></div>
<script type="module">
import Keycloak from 'https://cdn.jsdelivr.net/npm/keycloak-js@26.2.4/lib/keycloak.js';

const VERSION='20260912-mobile-access3';
const keycloak=new Keycloak({url:'https://auth.tayulabs.com',realm:'tayu-platform',clientId:'tayu-dashboard'});
window.__tayuEntryKeycloak=keycloak;
const status=document.getElementById('status');
const spinner=document.getElementById('spinner');

keycloak.init({onLoad:'login-required',pkceMethod:'S256',checkLoginIframe:false}).then(async authenticated=>{
  if(!authenticated)return;

  const roles=keycloak.tokenParsed?.realm_access?.roles||[];
  if(roles.includes('platform_super_admin')){
    status.textContent='Abriendo administración TAYULABS…';
    window.location.replace(`https://tayulabs.com/cloud-admin-v4.html?v=${VERSION}`);
    return;
  }

  const params=new URLSearchParams(window.location.search);
  if(params.get('boot')!=='2'){
    status.textContent='Preparando plataforma…';
    const next=new URL(window.location.href);
    next.searchParams.set('v',VERSION);
    next.searchParams.set('boot','2');
    window.location.replace(next.href);
    return;
  }

  status.textContent='Cargando plataforma…';
  const response=await fetch(`cloud-client-app.html?v=${VERSION}`,{cache:'no-store'});
  if(!response.ok)throw new Error(`No se pudo cargar la plataforma (${response.status})`);
  let html=await response.text();

  const saveGuardNeedle=`async function saveDashboardCloud(){
    if(!window.__tayuApiPost)return;`;
  const saveGuardReplacement=`async function saveDashboardCloud(){
    if(window.__tayuDashboardCloudLoaded!==true)return;
    if(!window.__tayuApiPost)return;`;
  if(!html.includes(saveGuardNeedle))throw new Error('No se encontró saveDashboardCloud para aplicar protección de sincronización');
  html=html.replace(saveGuardNeedle,saveGuardReplacement);

  const loadGuardNeedle=`const data=await window.__tayuApi('/dashboard');
    dashboardWidgetIds=Array.isArray(data.layout)?data.layout:[];`;
  const loadGuardReplacement=`const data=await window.__tayuApi('/dashboard');
    window.__tayuDashboardCloudLoaded=true;
    dashboardWidgetIds=Array.isArray(data.layout)?data.layout:[];`;
  if(!html.includes(loadGuardNeedle))throw new Error('No se encontró loadDashboardCloud para aplicar protección de sincronización');
  html=html.replace(loadGuardNeedle,loadGuardReplacement);

  const visualTypeNeedle=`type:document.getElementById('mbChartType')?.value||'line',`;
  const visualTypeReplacement=`type:(window.__tayuSelectedModbusVisualType || document.getElementById('mbChartType')?.value || 'line'),`;
  if(!html.includes(visualTypeNeedle))throw new Error('No se encontró el tipo de gráfica Modbus para aplicar compatibilidad visual');
  html=html.replace(visualTypeNeedle,visualTypeReplacement);

  const visualLoadNeedle=`set('mbChartType',cfg.type||'line');`;
  const visualLoadReplacement=`set('mbChartType',window.__tayuSelectedModbusVisualType || cfg.type || 'line');`;
  if(!html.includes(visualLoadNeedle))throw new Error('No se encontró la carga del tipo de gráfica Modbus');
  html=html.replace(visualLoadNeedle,visualLoadReplacement);

  const previewTypeNeedle=`mbPreviewChart.config.type=cfg.type||'line';`;
  const previewTypeReplacement=`mbPreviewChart.config.type=window.__tayuCustomVisualTypes?.has?.(cfg.type)?'line':(cfg.type||'line');`;
  if(!html.includes(previewTypeNeedle))throw new Error('No se encontró el tipo del preview Modbus');
  html=html.replace(previewTypeNeedle,previewTypeReplacement);

  const dashboardTypeNeedle=`   const cfg=modbusChartConfigs[instanceId];
   if(!cfg)return;

   const d=modbusDevices.find(x=>x.id===cfg.deviceId);`;
  const dashboardTypeReplacement=`   const cfg=modbusChartConfigs[instanceId];
   if(!cfg)return;
   if(window.__tayuCustomVisualTypes?.has?.(cfg.type)){
     if(c._chart){try{c._chart.destroy();}catch(_){} c._chart=null;}
     c.style.display='none';
     return;
   }

   const d=modbusDevices.find(x=>x.id===cfg.deviceId);`;
  if(!html.includes(dashboardTypeNeedle))throw new Error('No se encontró el renderer de gráficas Modbus del dashboard');
  html=html.replace(dashboardTypeNeedle,dashboardTypeReplacement);

  const openScript='<scr'+'ipt>';
  const openModuleScript='<scr'+'ipt type="module">';
  const closeScript='</scr'+'ipt>';
  const satelliteCompat=openScript+`
window.__tayuCustomVisualTypes=new Set(['tank','liquid','gauge','gauge_semi','kpi']);
window.__tayuSelectedModbusVisualType=null;
document.addEventListener('change',event=>{
  const id=event.target?.id||'';
  if(id==='mbChartType'){
    const value=String(event.target.value||'line');
    window.__tayuSelectedModbusVisualType=window.__tayuCustomVisualTypes.has(value)?value:null;
  }else if(id==='mbChartDevice'||id==='mbChartVariable'){
    window.__tayuSelectedModbusVisualType=null;
  }
},true);
function addSatelliteLayer(map){
  if(!map || !window.L)return null;
  return L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {maxZoom:19,attribution:'Imágenes © Esri'}
  ).addTo(map);
}
window.addSatelliteLayer=addSatelliteLayer;
`+closeScript;
  html=html.replace('</head>',satelliteCompat+'</head>');

  const modulePattern=/<script\s+type=["']module["']>\s*import\s+Keycloak\s+from\s+["']([^"']+)["'];\s*([\s\S]*?)<\/script>/i;
  const match=html.match(modulePattern);
  if(!match)throw new Error('No se encontró el módulo de autenticación de la plataforma');

  let appCode=match[2];

  const keycloakCreation=/const\s+keycloak\s*=\s*new\s+Keycloak\(\{[\s\S]*?clientId:\s*['"]tayu-dashboard['"][\s\S]*?\}\);/;
  if(!keycloakCreation.test(appCode))throw new Error('No se encontró la creación Keycloak del cliente');
  appCode=appCode.replace(keycloakCreation,"const keycloak = window.__tayuEntryKeycloak;");

  const secondInit=/keycloak\.init\(\{\s*onLoad:\s*['"]login-required['"],\s*pkceMethod:\s*['"]S256['"],\s*checkLoginIframe:\s*false\s*\}\)\.then\(async authenticated => \{/;
  if(!secondInit.test(appCode))throw new Error('No se encontró el segundo inicio Keycloak');
  appCode=appCode.replace(secondInit,"Promise.resolve(Boolean(keycloak && keycloak.authenticated)).then(async authenticated => {");

  const bootRevealNeedle=`    applyRolePermissions();
    try{await window.loadDashboardCloud?.();}catch(error){console.error('Dashboard VPS:',error)}`;
  const bootRevealReplacement=`    applyRolePermissions();
    window.hideAuthBootScreen?.();
    try{await window.loadDashboardCloud?.();}catch(error){console.error('Dashboard VPS:',error)}`;
  if(appCode.includes(bootRevealNeedle))appCode=appCode.replace(bootRevealNeedle,bootRevealReplacement);

  appCode=appCode.replace(
    "return keycloak.logout({ redirectUri: window.location.href });",
    `return keycloak.logout({ redirectUri: 'https://tayulabs.com/cloud-iot.html?from=logout&v=${VERSION}' });`
  );

  appCode += `
try{
  Object.defineProperty(window,'modbusChartConfigs',{configurable:true,get:()=>modbusChartConfigs,set:value=>{modbusChartConfigs=value&&typeof value==='object'?value:{}}});
  Object.defineProperty(window,'modbusDevices',{configurable:true,get:()=>modbusDevices,set:value=>{modbusDevices=Array.isArray(value)?value:[]}});
  Object.defineProperty(window,'dashboardWidgetIds',{configurable:true,get:()=>dashboardWidgetIds,set:value=>{dashboardWidgetIds=Array.isArray(value)?value:[]}});
}catch(error){console.warn('Puente visual Modbus:',error)}
window.currentMbChartSelection=currentMbChartSelection;
window.currentMbChartFormConfig=currentMbChartFormConfig;
window.loadMbChartFormFromSelection=loadMbChartFormFromSelection;
window.updateMbPreview=updateMbPreview;
window.loadMbHistoryFromVps=loadMbHistoryFromVps;
window.mbHistory=mbHistory;
window.saveModbusChartConfigs=saveModbusChartConfigs;
window.newWidgetInstance=newWidgetInstance;
window.saveWidgetLayout=saveWidgetLayout;
window.renderDashboardWidgets=renderDashboardWidgets;
window.renderDashboardModbusChart=renderDashboardModbusChart;
window.addModbusChartWidget=addModbusChartWidget;
if(typeof refreshLiveTelemetry==='function')window.refreshLiveTelemetry=refreshLiveTelemetry;
`;

  html=html.replace(modulePattern,openModuleScript+appCode+closeScript);

  const addons=
    '<scr'+'ipt src="cloud-client-branding.js?v='+VERSION+'"></scr'+'ipt>\n'+
    '<scr'+'ipt src="cloud-client-access.js?v='+VERSION+'"></scr'+'ipt>\n'+
    '<scr'+'ipt src="cloud-client-topbar-user.js?v='+VERSION+'"></scr'+'ipt>\n'+
    '<scr'+'ipt src="cloud-client-gps-generic.js?v='+VERSION+'"></scr'+'ipt>\n'+
    '<scr'+'ipt src="cloud-client-flotas-branding.js?v='+VERSION+'"></scr'+'ipt>\n'+
    '<scr'+'ipt src="cloud-client-sensor-export.js?v='+VERSION+'"></scr'+'ipt>\n'+
    '<scr'+'ipt src="cloud-client-mini-admin.js?v='+VERSION+'&fix=admindata1"></scr'+'ipt>\n'+
    '<scr'+'ipt src="cloud-client-mini-admin-visibility.js?v='+VERSION+'&fix=adminicon1"></scr'+'ipt>\n'+
    '<scr'+'ipt src="cloud-client-navigation-fixes.js?v='+VERSION+'&fix=devices-readonly2"></scr'+'ipt>\n'+
    '<scr'+'ipt src="cloud-client-view-refresh.js?v='+VERSION+'&fix=viewrefresh3"></scr'+'ipt>\n'+
    '<scr'+'ipt src="cloud-client-device-iot-stability.js?v='+VERSION+'&fix=iotstable2"></scr'+'ipt>\n'+
    '<scr'+'ipt src="cloud-client-sector-iot.js?v='+VERSION+'&fix=sectoriot4"></scr'+'ipt>\n'+
    '<scr'+'ipt src="cloud-client-sector-operation.js?v='+VERSION+'&fix=sectoroperation1"></scr'+'ipt>\n'+
    '<scr'+'ipt src="cloud-client-live-output.js?v='+VERSION+'&fix=smoothrelay3"></scr'+'ipt>\n'+
    '<scr'+'ipt src="cloud-client-modbus-consistency.js?v='+VERSION+'&fix=modbussync1"></scr'+'ipt>\n'+
    '<scr'+'ipt src="cloud-client-sensor-alerts.js?v='+VERSION+'&fix=sensoralerts1"></scr'+'ipt>\n'+
    '<scr'+'ipt src="cloud-client-alarm-background.js?v='+VERSION+'&fix=alarmbackground1"></scr'+'ipt>\n'+
    '<scr'+'ipt src="cloud-client-modbus-actions-stability.js?v='+VERSION+'&fix=modbusactions4"></scr'+'ipt>\n'+
    '<scr'+'ipt src="cloud-client-sidebar-drawer-guard.js?v='+VERSION+'"></scr'+'ipt>\n'+
    '<scr'+'ipt src="cloud-client-premium-shell.js?v='+VERSION+'"></scr'+'ipt>\n'+
    '<scr'+'ipt src="cloud-client-premium-dark-edges.js?v='+VERSION+'"></scr'+'ipt>\n'+
    '<scr'+'ipt src="cloud-client-premium-mobile.js?v='+VERSION+'"></scr'+'ipt>';
  html=html.replace('</body>',addons+'</body>');

  document.open();
  document.write(html);
  document.close();
}).catch(error=>{
  console.error('TAYULABS client entry:',error);
  spinner.style.display='none';
  status.textContent='No se pudo iniciar la sesión segura. Recarga la página para intentar nuevamente.';
  status.classList.add('error');
});
</script>
</body>
</html>
